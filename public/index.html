<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colony</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #1a1a1a;
      }
      #world {
        display: block;
        border: 1px solid #444;
        margin-block: 1rem;
        cursor: grab;
      }
      #world:active {
        cursor: grabbing;
      }
      #resources {
        font-weight: 600;
      }
      #status {
        min-height: 1.5rem;
        color: #555;
      }
      #hint {
        color: #777;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Colony</h1>
      <p id="resources">sugar: 0 · protein: 0 · biomass: 0</p>
      <p>Select a worker, then click a resource node to gather, or empty ground to send it there.</p>
      <canvas id="world" width="960" height="600"></canvas>
      <p id="hint">Pan with WASD, the arrow keys, or by dragging the map.</p>
      <button id="reproduce">Reproduce worker (50 protein)</button>
      <p id="status"></p>
      <p><a href="/readme/">About this app</a></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
